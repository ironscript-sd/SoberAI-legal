<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoberAI — Legal</title>
  <style>
    :root {
      --bg: #1a0a18;
      --card: #2a1426;
      --text: #f5f0f3;
      --muted: #a89aa3;
      --accent: #ff3d8b;
      --accent-2: #b933e6;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container {
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-radius: 22px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }
    h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    .subtitle {
      color: var(--muted);
      margin-bottom: 36px;
      font-size: 15px;
    }
    .link-card {
      display: block;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 24px;
      margin-bottom: 12px;
      text-decoration: none;
      color: var(--text);
      text-align: left;
      transition: transform 0.15s, border-color 0.15s;
    }
    .link-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }
    .link-card .title {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .link-card .desc {
      font-size: 13px;
      color: var(--muted);
    }
    .footer {
      margin-top: 32px;
      color: var(--muted);
      font-size: 13px;
    }
    .footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🍺</div>
    <h1>SoberAI</h1>
    <p class="subtitle">Know before you go</p>

    <a href="privacy.html" class="link-card">
      <div class="title">🔒 Privacy Policy</div>
      <div class="desc">How we handle your data</div>
    </a>

    <a href="terms.html" class="link-card">
      <div class="title">⚖️ Terms &amp; Conditions</div>
      <div class="desc">Terms of use and legal disclaimers</div>
    </a>

    <a href="support.html" class="link-card">
      <div class="title">💬 Support</div>
      <div class="desc">Get in touch with us</div>
    </a>

    <p class="footer">© 2026 SoberAI · <a href="mailto:thesalarsaber@gmail.com">thesalarsaber@gmail.com</a></p>
  </div>
</body>
</html>
