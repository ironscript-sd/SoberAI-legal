<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support — SoberAI</title>
  <style>
    :root {
      --bg: #1a0a18;
      --card: #2a1426;
      --text: #f5f0f3;
      --muted: #a89aa3;
      --accent: #ff3d8b;
      --accent-2: #b933e6;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container {
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-radius: 22px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }
    h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    .subtitle {
      color: var(--muted);
      margin-bottom: 36px;
      font-size: 15px;
    }
    .contact-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px 24px;
      margin-bottom: 24px;
    }
    .contact-card .label {
      font-size: 13px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 10px;
    }
    .contact-card a {
      font-size: 19px;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
      word-break: break-all;
    }
    .contact-card a:hover {
      text-decoration: underline;
    }
    .back-link {
      display: inline-block;
      margin-top: 8px;
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
    }
    .back-link:hover { color: var(--accent); }
    .footer {
      margin-top: 32px;
      color: var(--muted);
      font-size: 13px;
    }
    .footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">💬</div>
    <h1>Support</h1>
    <p class="subtitle">We're here if you need us</p>

    <div class="contact-card">
      <div class="label">Contact</div>
      <a href="mailto:thesalarsaber@gmail.com">thesalarsaber@gmail.com</a>
    </div>

    <a href="index.html" class="back-link">← Back</a>

    <p class="footer">© 2026 SoberAI · <a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a></p>
  </div>
</body>
</html>
